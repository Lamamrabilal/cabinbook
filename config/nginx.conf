# Configuration nginx pour CabinBook — reverse proxy vers gunicorn
# + service direct des fichiers statiques/média pour de meilleures performances

upstream cabinbook_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;  # ⚠️ Remplacez par votre vrai domaine, ex: cabinbook.fr www.cabinbook.fr

    client_max_body_size 20M;

    # Fichiers statiques Django (CSS/JS admin, etc.)
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Fichiers média (uploads utilisateurs)
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Tout le reste part vers Django/gunicorn
    location / {
        proxy_pass http://cabinbook_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}

